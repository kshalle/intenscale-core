# prepare_env.conf
#
# All configurable parameters for prepare_env.sh live here. Edit this
# file to change any value -- prepare_env.sh itself should not need
# to be touched.
#
# This file is loaded with bash's `source`, so it's plain bash:
# comments start with #, values are ordinary assignments, and the
# disk-image lookup below is a normal bash associative array.
#
# None of these values are secrets. Google Drive file IDs only work
# for files shared as "Anyone with the link" (the org's current
# setup) -- see the user guide for what that means for access
# control.
#
# This same file (with real values filled in) is committed identically
# into both the i-firesim and i-rocket-chip repos -- prepare_env.sh
# only reads the half relevant to whichever repo it's running in.

# -----------------------------------------------------------------------
# Google Drive file IDs
# -----------------------------------------------------------------------
# From each file's OWN share link: drive.google.com/file/d/<ID>/view
# Each file must individually be set to "Anyone with the link" --
# sharing only the parent folder is not always enough for direct-by-ID
# downloads to work reliably.

FIRESIM_DOCKER_IMAGE_FILEID="1-y-C_rqg25HVs0QY4VSMwWI6bFp9sboT"
ROCKETCHIP_DOCKER_IMAGE_FILEID="18v83VDUYBxx1qXW7w-3OW-VV5pZB-Z7M"

# OS disk images (FireSim only). Keys must be exactly "buildroot",
# "fedora", "ubuntu" -- these are what --os-image=<name> matches
# against. (declare -A here is redundant with prepare_env.sh, which
# already declares this as associative before loading this file, but
# it's kept so this file is unambiguous read on its own.)
declare -A FIRESIM_DISK_IMAGE_FILEIDS=(
  [buildroot]="REPLACE_WITH_BUILDROOT_DISK_IMAGE_FILE_ID"
  [fedora]="REPLACE_WITH_FEDORA_DISK_IMAGE_FILE_ID"
  [ubuntu]="1p-suG5c8Ebb3Q-UKyc_xT3aS0UdRFG2c"
)
FIRESIM_DEFAULT_OS_IMAGE="ubuntu-disk"

# -----------------------------------------------------------------------
# Checksums (optional, but strongly recommended)
# -----------------------------------------------------------------------
# SHA256 of each file, checked after every download AND against any
# already-downloaded copy on every run -- large "Anyone with the link"
# Drive downloads can come back corrupted without gdown or Docker
# noticing (Docker's own `docker load` can report success on a
# corrupted image; see the user guide). Leave any of these blank to
# skip verification for that file.
#
# To compute one: after confirming a download is good (e.g. it loads
# and runs correctly), run `sha256sum <file>` and paste the hash here.

FIRESIM_DOCKER_IMAGE_SHA256="85a1a3184268ab6773ddee9230c49b79b5cc2f8a60f4991e5a2c2432a466ace2"
ROCKETCHIP_DOCKER_IMAGE_SHA256="469348af2ac606149893cb789ff224796f0f2e62dd7d938bd6283cffaf45c983"
declare -A FIRESIM_DISK_IMAGE_SHA256S=(
  [buildroot]=""
  [fedora]=""
  [ubuntu]=""
)

# -----------------------------------------------------------------------
# Local filenames
# -----------------------------------------------------------------------
# What each download is saved as locally. (Drive filenames aren't used
# directly since gdown addresses files by ID, not name.)

FIRESIM_DOCKER_IMAGE_FILE="i-firesim-docker-image.gz"
ROCKETCHIP_DOCKER_IMAGE_FILE="i-rocketchip-docker-image.gz"

# -----------------------------------------------------------------------
# Docker image tags
# -----------------------------------------------------------------------
# What each image is named/tagged as after `docker load`.

FIRESIM_DOCKER_IMAGE_NAME="intensivate/i-firesim-eval:0.1.0"
ROCKETCHIP_DOCKER_IMAGE_NAME="intensivate/i-rocket-mounted:0.1.0"

# -----------------------------------------------------------------------
# Container user (see "UID/GID alignment" in the user guide)
# -----------------------------------------------------------------------
# Default account baked into both images, which owns everything inside
# the image (toolchains, build dirs, etc). Its UID/GID gets remapped
# to match whoever runs prepare_env.sh.

CONTAINER_USER="intens4"

# Optional. Where CONTAINER_USER's home directory lives -- this is the
# only path the UID/GID remap step touches ownership of (see the user
# guide), since that's normally the one thing the account exclusively
# owns. Leave blank to default to /home/$CONTAINER_USER; only set this
# if an image puts the account's home somewhere else.
CONTAINER_USER_HOME=""

# -----------------------------------------------------------------------
# Disk space thresholds (GB)
# -----------------------------------------------------------------------
# Free space required before downloading. FireSim's is higher since it
# also needs headroom for the one-time UID/GID remap step (roughly the
# docker image's own size again, the first time it runs).

FIRESIM_MIN_FREE_GB=60
ROCKETCHIP_MIN_FREE_GB=20

# -----------------------------------------------------------------------
# Local paths
# -----------------------------------------------------------------------
# Where downloaded assets land, relative to the repo root.

ASSET_DIR=".env-assets"
